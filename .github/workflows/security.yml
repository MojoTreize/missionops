name: Sécurité

# B8.3 : analyse statique (CodeQL) et audit des dépendances, sur chaque PR et
# chaque semaine (nouvelles vulnérabilités publiées sur des dépendances
# inchangées).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependances:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Vulnérabilités élevées ou critiques en production
        run: pnpm audit --prod --audit-level high
